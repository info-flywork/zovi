<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open in Zovi</title>
  <meta name="description" content="Open this profile in the Zovi app." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange: #ff5c1a;
      --amber: #f2a05a;
      --violet: #da87fd;
      --roast: #1a1714;
      --cream: #f5e6d8;
      --off: #f7f3ee;
      --muted: rgba(26, 23, 20, 0.55);
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      color: var(--roast);
      background:
        radial-gradient(ellipse 80% 60% at 12% 8%, #ffe0d0 0%, transparent 58%),
        radial-gradient(ellipse 70% 50% at 92% 88%, #d8f5ee 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 80% 18%, #f3d9ff 0%, transparent 50%),
        var(--off);
    }
    .card {
      width: min(420px, 100%);
      text-align: center;
      padding: 40px 28px 28px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 24px 60px rgba(26, 23, 20, 0.08),
        0 2px 8px rgba(26, 23, 20, 0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .wordmark {
      margin: 0 0 6px;
      font-family: "Pacifico", cursive;
      font-size: 64px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -1.28px;
      color: var(--roast);
    }
    .lede {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.45;
    }
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #e8622a, #f2a05a, #da87fd);
    }
    .avatar span {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--white);
      color: var(--orange);
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.04em;
    }
    .handle {
      display: inline-flex;
      align-items: center;
      margin-bottom: 22px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--cream);
      color: var(--roast);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 54px;
      padding: 0 20px;
      border-radius: 999px;
      background: var(--roast);
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    a.button:hover { background: #000; transform: translateY(-1px); }
    a.button:active { transform: translateY(0); }
    .stores {
      margin-top: 18px;
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stores a {
      color: var(--orange);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }
    .stores a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="wordmark">zovi</h1>
    <p class="lede">Open this profile in the app. If Zovi is installed, it should launch automatically.</p>
    <div class="avatar" aria-hidden="true"><span id="initial">Z</span></div>
    <div id="handle" class="handle">@user</div>
    <a id="openApp" class="button" href="#">Open in Zovi</a>
    <div class="stores">
      <a href="https://apps.apple.com/">App Store</a>
      <a href="https://play.google.com/store">Google Play</a>
    </div>
  </main>
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var handle = parts.length >= 2 && parts[0] === 'u' ? parts[1] : '';
      handle = decodeURIComponent(handle || '').replace(/^@/, '');
      var label = document.getElementById('handle');
      var openApp = document.getElementById('openApp');
      var initial = document.getElementById('initial');
      if (handle) {
        label.textContent = '@' + handle;
        initial.textContent = handle.charAt(0).toUpperCase();
        openApp.href = 'zovi://u/' + encodeURIComponent(handle);
      } else {
        label.textContent = 'zovi.app';
        initial.textContent = 'Z';
        openApp.href = 'https://zovi.app';
      }
    })();
  </script>
</body>
</html>
